<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patent Multimodal Retriever</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Google+Sans:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --google-blue: #1a73e8;
            --google-red: #d93025;
            --google-yellow: #f4b400;
            --google-green: #1e8e3e;
            --google-gray: #5f6368;
            --google-border: #dfe1e5;
            --google-bg: #ffffff;
            --google-hover: #f8f9fa;
        }

        body { font-family: 'Roboto', 'Google Sans', sans-serif; margin: 0; padding: 0; background-color: var(--google-bg); color: #202124; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        
        /* --- Header --- */
        header { display: flex; align-items: center; padding: 15px 30px; border-bottom: 1px solid var(--google-border); background: white; position: sticky; top: 0; z-index: 100; }
        .logo { font-size: 24px; font-weight: 500; color: var(--google-gray); cursor: pointer; display: flex; align-items: center; }
        .logo span:nth-child(1) { color: var(--google-blue); }
        .logo span:nth-child(2) { color: var(--google-red); }
        .logo span:nth-child(3) { color: var(--google-yellow); }
        .logo span:nth-child(4) { color: var(--google-blue); }
        .logo span:nth-child(5) { color: var(--google-green); }
        .logo span:nth-child(6) { color: var(--google-red); }

        /* --- Input Section --- */
        .input-section { margin: 30px 0; }
        .input-grid { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 20px; margin-bottom: 25px; }
        .claim-area { grid-column: 1; grid-row: 1; }
        .element-area { grid-column: 1; grid-row: 2; }
        .drawing-area { grid-column: 2; grid-row: 1 / span 2; display: flex; flex-direction: column; }
        
        .input-card { background: white; border: 1px solid var(--google-border); border-radius: 8px; padding: 15px; transition: box-shadow 0.2s; display: flex; flex-direction: column; }
        .input-card:hover { box-shadow: 0 1px 6px rgba(32,33,36,0.28); }
        .input-card h3 { margin-top: 0; font-size: 14px; text-transform: uppercase; color: var(--google-gray); border-bottom: 1px solid #f0f0f0; padding-bottom: 10px; margin-bottom: 15px; }
        
        textarea { width: 100%; height: 120px; border: 1px solid #eee; border-radius: 4px; padding: 10px; resize: none; font-size: 14px; font-family: inherit; outline: none; box-sizing: border-box; }
        
        .file-drop-zone { border: 2px dashed #eee; border-radius: 4px; padding: 30px; text-align: center; cursor: pointer; color: #9aa0a6; flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; overflow: hidden; }
        .file-drop-zone img { width: 100%; height: 100%; object-fit: contain; position: absolute; top: 0; left: 0; display: none; background-color: white; z-index: 10; }
        
        .action-bar { display: flex; justify-content: center; gap: 15px; margin-top: 20px; }
        .btn { padding: 10px 24px; border: 1px solid #dadce0; border-radius: 4px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s; }
        .btn-search { background-color: var(--google-blue); color: white; border: none; min-width: 150px; }
        .btn-search:hover { background-color: #1b66c9; }
        .btn-export { background-color: #f8f9fa; display: none; }
        .btn-reset { background-color: white; color: var(--google-gray); }

        /* --- Output Section --- */
        .output-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; }
        .column { background: white; border: 1px solid var(--google-border); border-radius: 8px; display: flex; flex-direction: column; min-height: 450px; overflow: hidden; }
        .column-header { padding: 12px; font-size: 14px; font-weight: 500; background: var(--google-hover); border-bottom: 1px solid var(--google-border); }
        .k1-line { border-left: 4px solid var(--google-red); }
        .k3-line { border-left: 4px solid var(--google-green); }
        .k2-line { border-left: 4px solid var(--google-blue); }
        .combined-line { border-left: 4px solid var(--google-gray); }
        
        .result-list { list-style: none; padding: 0; margin: 0; flex: 1; overflow-y: auto; }
        .result-item { padding: 12px 16px; border-bottom: 1px solid #f1f3f4; display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        .result-item:hover { background-color: var(--google-hover); }
        .res-id { font-size: 14px; font-weight: 500; }
        .res-score { font-size: 12px; color: var(--google-gray); }

        #tooltip { display: none; position: fixed; background: white; padding: 15px; border-radius: 8px; z-index: 1000; max-width: 380px; font-size: 13px; box-shadow: 0 4px 15px rgba(0,0,0,0.15); border: 1px solid var(--google-border); pointer-events: none; }
        #tooltip img { max-width: 100%; border-radius: 4px; }

        #loader { display: none; text-align: center; margin: 20px 0; font-size: 14px; color: var(--google-gray); }
        .spinner { border: 2px solid #f3f3f3; border-top: 2px solid var(--google-blue); border-radius: 50%; width: 18px; height: 18px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <div class="logo"><span>P</span><span>a</span><span>t</span><span>e</span><span>n</span><span>t</span>&nbsp;Retriever</div>
</header>

<div class="container">
    <div class="input-section">
        <div class="input-grid">
            <div class="input-card claim-area">
                <h3>Claim Search</h3>
                <textarea id="claimInput" placeholder="독립항 또는 주요 청구항 내용을 입력하세요..."></textarea>
            </div>
            <div class="input-card element-area">
                <h3>Element Search</h3>
                <textarea id="elementInput" placeholder="주요 구성 요소 또는 기술 키워드를 나열하여 입력하세요(쉼표로 구분)..."></textarea>
            </div>
            <div class="input-card drawing-area">
                <h3>Drawing Search</h3>
                <div class="file-drop-zone" onclick="document.getElementById('fileInput').click()">
                    <span style="font-size: 40px; margin-bottom: 10px;">📷</span>
                    <span>클릭하거나 이미지를 드래그하여 업로드</span>
                    <img id="imagePreview" alt="미리보기">
                </div>
                <input type="file" id="fileInput" accept="image/*" style="display:none">
            </div>
        </div>
        <div class="action-bar">
            <button id="searchBtn" class="btn btn-search">통합 멀티모달 검색</button>
            <button id="exportBtn" class="btn btn-export">Excel 결과 저장</button>
            <button id="resetBtn" class="btn btn-reset">초기화</button>
        </div>
    </div>

    <div id="loader"><div class="spinner"></div> 벡터 인덱스 검색 중...</div>

    <div class="output-grid">
        <div class="column"><div class="column-header k1-line">K1: 청구항 유사도</div><ul id="k1List" class="result-list"></ul></div>
        <div class="column"><div class="column-header k3-line">K3: 구성요소 유사도</div><ul id="k3List" class="result-list"></ul></div>
        <div class="column"><div class="column-header k2-line">K2: 도면 시각 유사도</div><ul id="k2List" class="result-list"></ul></div>
        <div class="column"><div class="column-header combined-line">통합 랭킹 (Top)</div><ul id="combinedList" class="result-list"></ul></div>
    </div>
</div>

<div id="tooltip"></div>

<script>
    const API_BASE = "http://localhost:8000";
    const DOM = {
        claim: document.getElementById('claimInput'),
        element: document.getElementById('elementInput'),
        file: document.getElementById('fileInput'),
        preview: document.getElementById('imagePreview'),
        searchBtn: document.getElementById('searchBtn'),
        exportBtn: document.getElementById('exportBtn'),
        resetBtn: document.getElementById('resetBtn'),
        loader: document.getElementById('loader'),
        tooltip: document.getElementById('tooltip'),
        lists: {
            k1: document.getElementById('k1List'),
            k3: document.getElementById('k3List'),
            k2: document.getElementById('k2List'),
            combined: document.getElementById('combinedList')
        }
    };

    let lastResults = null;
    let currentQueryClaim = '';
    let currentQueryElement = '';

    function escapeHtml(s) {
        return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
    }

    function highlightText(text, query) {
        const safe = escapeHtml(text);
        if (!query) return safe;
        const words = [...new Set(query.split(/\W+/).filter(w => w.length > 1))];
        if (!words.length) return safe;
        const regex = new RegExp('(' + words.map(w => w.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')).join('|') + ')', 'gi');
        return safe.replace(regex, '<mark style="background:#FFFF00;padding:0 2px;border-radius:2px;">$1</mark>');
    }

    DOM.file.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (file) {
            const formData = new FormData();
            formData.append('file', file);
            try {
                // Use server-side conversion for preview to support TIF
                const resp = await fetch(`${API_BASE}/api/preview`, { method: 'POST', body: formData });
                if (resp.ok) {
                    const blob = await resp.blob();
                    DOM.preview.src = URL.createObjectURL(blob);
                    DOM.preview.style.display = 'block';
                } else {
                    throw new Error("Preview failed");
                }
            } catch (err) {
                console.error(err);
                alert("미리보기를 불러올 수 없습니다. 서버가 실행 중인지 확인하세요.");
            }
        } else {
            DOM.preview.src = '';
            DOM.preview.style.display = 'none';
        }
    });

    DOM.resetBtn.addEventListener('click', () => {
        DOM.claim.value = ''; DOM.element.value = ''; DOM.file.value = '';
        DOM.preview.src = ''; DOM.preview.style.display = 'none';
        lastResults = null;
        currentQueryClaim = '';
        currentQueryElement = '';
        Object.values(DOM.lists).forEach(l => l.innerHTML = '');
        DOM.exportBtn.style.display = 'none';
    });

    function sortCommaList(s) {
        return s.split(',').map(t => t.trim()).filter(Boolean)
            .sort((a, b) => a.localeCompare(b, undefined, {sensitivity: 'base'}))
            .join(', ');
    }

    DOM.searchBtn.addEventListener('click', async () => {
        const claim = DOM.claim.value.trim();
        let element = DOM.element.value.trim();
        const image = DOM.file.files[0];
        if (!claim && !element && !image) return alert('검색할 텍스트 또는 도면을 입력해 주세요.');
        if (element) { element = sortCommaList(element); DOM.element.value = element; }
        currentQueryClaim = claim;
        currentQueryElement = element;

        const formData = new FormData();
        if (claim) formData.append('query_claim', claim);
        if (element) formData.append('query_element', element);
        if (image) formData.append('query_image', image);
        formData.append('k', 10);

        setUI(true);
        try {
            const resp = await fetch(`${API_BASE}/search`, { method: 'POST', body: formData });
            if (!resp.ok) throw new Error('Search failed');
            lastResults = await resp.json();
            renderResults(lastResults);
            DOM.exportBtn.style.display = 'block';
        } catch (err) {
            alert('검색 중 오류가 발생했습니다.');
        } finally {
            setUI(false);
        }
    });

    DOM.exportBtn.addEventListener('click', async () => {
        if (!lastResults) return;
        const formData = new FormData();
        formData.append('input_text', `Claim: ${DOM.claim.value}\nElement: ${DOM.element.value}`);
        formData.append('input_image_name', DOM.file.files[0] ? DOM.file.files[0].name : "");
        formData.append('query_claim', currentQueryClaim);
        formData.append('query_element', currentQueryElement);
        formData.append('results_json', JSON.stringify(lastResults));
        try {
            const resp = await fetch(`${API_BASE}/export`, { method: 'POST', body: formData });
            const blob = await resp.blob();
            const link = document.createElement('a');
            link.href = window.URL.createObjectURL(blob);
            link.download = `Retrieval_${new Date().getTime()}_USPTO_LGD.xlsx`;
            link.click();
        } catch (err) {
            alert('Excel 추출에 실패했습니다.');
        }
    });

    function setUI(loading) {
        DOM.loader.style.display = loading ? 'block' : 'none';
        DOM.searchBtn.disabled = loading;
        if (loading) { Object.values(DOM.lists).forEach(l => l.innerHTML = ''); DOM.exportBtn.style.display = 'none'; }
    }

    function renderResults(data) {
        data.k1.forEach(i => DOM.lists.k1.appendChild(createRow(i, 'var(--google-red)')));
        data.k3.forEach(i => DOM.lists.k3.appendChild(createRow(i, 'var(--google-green)')));
        data.k2.forEach(i => DOM.lists.k2.appendChild(createRow(i, 'var(--google-blue)', true)));
        data.combined.forEach(i => DOM.lists.combined.appendChild(createRow(i, i.color, i.type === 'image', true)));
    }

    function createRow(item, color, isImg = false, isComb = false) {
        const li = document.createElement('li');
        li.className = 'result-item';
        const displayId = isComb ? item.display_id : item.id;
        const scoreText = (isComb && item.rrf_score !== undefined)
            ? `RRF:${item.rrf_score.toFixed(4)} | ${(item.score * 100).toFixed(1)}%`
            : `${(item.score * 100).toFixed(1)}%`;
        li.innerHTML = `<span class="res-id" style="color:${color}">${displayId}</span><span class="res-score">${scoreText}</span>`;
        li.onmouseenter = (e) => {
            DOM.tooltip.style.display = 'block';
            if (isImg) {
                const imgUrl = item.tooltip.startsWith('/') ? `${API_BASE}${item.tooltip}` : item.tooltip;
                DOM.tooltip.innerHTML = `<img src="${imgUrl}" onerror="this.src='https://via.placeholder.com/150?text=Error+Loading+Image'">`;
            } else {
                const q = item.type === 'claim' ? currentQueryClaim : item.type === 'element' ? currentQueryElement : null;
                DOM.tooltip.innerHTML = highlightText(item.tooltip, q);
            }
            moveTooltip(e);
        };
        li.onmousemove = moveTooltip;
        li.onmouseleave = () => DOM.tooltip.style.display = 'none';
        return li;
    }

    function moveTooltip(e) {
        let x = e.clientX + 15, y = e.clientY + 15;
        if (x + 400 > window.innerWidth) x = e.clientX - 415;
        if (y + 300 > window.innerHeight) y = e.clientY - 315;
        DOM.tooltip.style.left = x + 'px'; DOM.tooltip.style.top = y + 'px';
    }
</script>
</body>
</html>
